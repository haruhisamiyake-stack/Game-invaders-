<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="レバーを引いて10円玉を転がし、東京→工場へ。税理士法人アストラストのミニゲーム。">
<meta name="theme-color" content="#f2c020">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f2c020'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23caa63a' stroke='%238a6a1f' stroke-width='4'/%3E%3Ctext x='32' y='41' font-size='20' font-family='sans-serif' fill='%237a5c18' text-anchor='middle'%3E10%3C/text%3E%3C/svg%3E">
<title>10円ゲーム — 税理士法人アストラスト</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#0e1730;color:#5a4a10;
    font-family:"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:8px;gap:6px;overflow:hidden;}
  #wrap{position:relative;width:min(100%,430px);}
  canvas{display:block;width:100%;height:auto;border:6px solid #2aa5b5;border-radius:10px;
    background:#f2c020;touch-action:none;box-shadow:0 6px 20px rgba(0,0,0,.4);}
  .hint{font-size:11px;letter-spacing:.04em;color:#cfc0a6;text-align:center;}
  .hint a{color:#f2c020;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div class="hint">画面を長押し＝レバーを引いて10円を転がす／離すと止まる<br><a href="https://shorui-invader.web.app/">← 書類インベーダーへ</a></div>

<script>
const W = 380, H = 620;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1;
function resize(){
  const cssW = cv.parentNode.clientWidth, cssH = cssW * H / W;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  scale = cv.width / W; ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', resize);

/* ---------- 駅・ランドマーク ---------- */
const STATIONS = [
  { n:'東京駅',       e:'🚉' },
  { n:'スカイツリー', e:'🗼' },
  { n:'富士山',       e:'🗻' },
  { n:'お城',         e:'🏯' },
  { n:'神社',         e:'⛩️' },
  { n:'東京タワー',   e:'🗼' },
  { n:'灯台',         e:'💡' },
  { n:'工場',         e:'🏭' }
];
const RAMPS = STATIONS.length - 1;   // 7区間
const M = 34, TOP = 100, BOT = 552;
const GAP = (BOT - TOP) / RAMPS, TILT = 10;
function rampGeom(i){
  const y = TOP + i * GAP, leftFirst = (i % 2 === 0);
  const xEntry = leftFirst ? M : W - M, xExit = leftFirst ? W - M : M;
  return { y, xEntry, xExit, yEntry: y, yExit: y + TILT };
}
/* ---------- 物理 ---------- */
const ACCEL = 0.00042, FRIC = 0.930, CROSS = 0.0040, STOP = 0.0006;
const HOLE = { u0: 0.30, u1: 0.42 };
function dzStart(i){ return 1.0 - Math.max(0.09, 0.20 - i * 0.018); }

/* ---------- 状態 ---------- */
let state = 'title', coin, score = 0, coins = 3, best = 0, holding = false,
    endT = 0, shake = 0, sparkle = [], leverA = 0;
try{ best = +localStorage.getItem('juen_best') || 0; }catch(e){}
function newCoin(){ coin = { i:0, u:0, v:0, spin:0, drop:0 }; state = 'play'; holding = false; }
function startGame(){ score = 0; coins = 3; sparkle = []; newCoin(); }

/* ---------- 音 ---------- */
let ac = null;
function beep(freq, dur, type='square', vol=.05){
  try{ if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.value=freq;
    g.gain.value=vol; o.connect(g); g.connect(ac.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur); o.stop(ac.currentTime+dur);
  }catch(e){}
}

/* ---------- 入力（長押し＝レバーを引く） ---------- */
function press(){
  if(ac && ac.state==='suspended') ac.resume();
  if(state==='title' || state==='over'){ startGame(); return; }
  if(state==='out' || state==='win'){ newCoin(); return; }
  if(state==='play') holding = true;
}
function release(){ holding = false; }
cv.addEventListener('pointerdown', e=>{ e.preventDefault(); press(); });
cv.addEventListener('pointerup',   e=>{ e.preventDefault(); release(); });
cv.addEventListener('pointercancel', release);
addEventListener('keydown', e=>{ if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!e.repeat) press(); } });
addEventListener('keyup',   e=>{ if(e.code==='Space'||e.code==='Enter'){ release(); } });

/* ---------- 更新 ---------- */
function coinXY(){
  const g = rampGeom(coin.i);
  return { x: g.xEntry+(g.xExit-g.xEntry)*coin.u, y: (g.yEntry+(g.yExit-g.yEntry)*coin.u)-11-(coin.drop||0), g };
}
function fail(){
  coins--; shake = 14; beep(150,.5,'sawtooth',.06); beep(90,.6,'square',.05); endT = 0; holding = false;
  if(coins <= 0){ state = 'over'; if(score>best){ best=score; try{localStorage.setItem('juen_best',best);}catch(e){} } }
  else state = 'out';
}
function advance(){
  const p = coinXY();
  for(let k=0;k<7;k++) sparkle.push({x:p.x, y:p.y, vx:(Math.random()-.5)*3, vy:-Math.random()*3-1, life:24});
  coin.i++; score += 100 + coin.i*20; beep(660,.06,'square',.05); beep(990,.08,'triangle',.04);
  if(coin.i >= RAMPS){ state='win'; endT=0; shake=12; score+=300;
    if(score>best){ best=score; try{localStorage.setItem('juen_best',best);}catch(e){} }
    beep(784,.5,'triangle',.06); beep(1046,.6,'triangle',.05);
  } else { coin.u = 0; coin.v = 0; coin.drop = 10; }
}
function update(){
  if(shake>0) shake--;
  leverA += (((holding && state==='play') ? 1 : 0) - leverA) * 0.3;
  for(const s of sparkle){ s.x+=s.vx; s.y+=s.vy; s.vy+=.18; s.life--; }
  sparkle = sparkle.filter(s=>s.life>0);
  if(state==='out'||state==='win'||state==='over') endT++;
  if(state!=='play') return;
  if(coin.drop>0) coin.drop--;
  if(holding) coin.v += ACCEL;
  coin.v *= FRIC; if(coin.v < 0.00001) coin.v = 0;
  coin.u += coin.v; coin.spin += coin.v*30;
  if(coin.u > HOLE.u0 && coin.u < HOLE.u1 && coin.v < CROSS){ fail(); return; }  // 穴に落ちる
  if(coin.u >= 1.0){ fail(); return; }                                          // 行き過ぎて落下
  if(!holding && coin.v < STOP && coin.u >= dzStart(coin.i)) advance();          // 緑ゾーンで停止→次段
}

/* ---------- 描画 ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function emoji(ch,x,y,s){ ctx.font=s+'px "Noto Color Emoji","Apple Color Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ch,x,y); }
function oval(t,x,y){ ctx.font='bold 10px "Yu Gothic",system-ui,sans-serif'; const w=ctx.measureText(t).width+12;
  ctx.fillStyle='#fff'; rr(x-w/2,y-8,w,16,8); ctx.fill(); ctx.strokeStyle='#c8b070'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#3a2e10'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,x,y); }
function drawCoin(x,y){ ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(coin.spin)*.14);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.arc(1,2,11,0,6.283); ctx.fill();
  ctx.fillStyle='#caa63a'; ctx.beginPath(); ctx.arc(0,0,11,0,6.283); ctx.fill();
  ctx.strokeStyle='#8a6a1f'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.fillStyle='#f2e2a8'; ctx.beginPath(); ctx.arc(0,0,7.5,0,6.283); ctx.fill();
  ctx.fillStyle='#7a5c18'; ctx.font='bold 9px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('10',0,1); ctx.restore(); }
function lcd(x,y,w,label,val){ ctx.fillStyle='#3a2e10'; rr(x,y,w,34,5); ctx.fill();
  ctx.fillStyle='#111'; rr(x+4,y+13,w-8,17,3); ctx.fill();
  ctx.fillStyle='#e8d9a8'; ctx.font='bold 9px "Yu Gothic",system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText(label,x+w/2,y+2);
  ctx.fillStyle='#ff5a3a'; ctx.font='bold 15px "Courier New",monospace'; ctx.textBaseline='middle'; ctx.fillText(val,x+w/2,y+22); }
function ptOnRamp(g,u){ return { x:g.xEntry+(g.xExit-g.xEntry)*u, y:g.yEntry+(g.yExit-g.yEntry)*u }; }

function drawLever(){
  const bx = W-40, by = H-42;
  ctx.save(); ctx.translate(bx,by);
  ctx.fillStyle='#7a5c18'; ctx.beginPath(); ctx.arc(0,0,13,0,6.283); ctx.fill();
  ctx.rotate(-0.9 + leverA*1.5);
  ctx.strokeStyle='#c0392b'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-30); ctx.stroke();
  ctx.fillStyle='#e04030'; ctx.beginPath(); ctx.arc(0,-32,7,0,6.283); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#5a4410'; ctx.font='bold 9px system-ui'; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillText('レバー', bx, by+16);
}

function draw(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake*.4,(Math.random()-.5)*shake*.4);
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#f7d94a'); bg.addColorStop(1,'#eeba14');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(const c of [[70,150,26],[300,140,30],[110,470,22],[330,505,20]]){
    ctx.beginPath(); ctx.arc(c[0],c[1],c[2],0,6.283); ctx.arc(c[0]+c[2],c[1]+4,c[2]*.8,0,6.283); ctx.arc(c[0]-c[2],c[1]+4,c[2]*.7,0,6.283); ctx.fill(); }

  ctx.fillStyle='#e0b84a'; rr(8,8,150,38,8); ctx.fill(); ctx.strokeStyle='#8a6a1f'; ctx.lineWidth=2; rr(8,8,150,38,8); ctx.stroke();
  ctx.fillStyle='#caa63a'; ctx.beginPath(); ctx.arc(28,27,12,0,6.283); ctx.fill(); ctx.strokeStyle='#8a6a1f'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#5a4410'; ctx.font='bold 10px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('10',28,28);
  ctx.fillStyle='#3a2e10'; ctx.font='bold 20px "Yu Gothic",system-ui,sans-serif'; ctx.textAlign='left'; ctx.fillText('円ゲーム',46,28);
  lcd(210,8,86,'スコア', ('000'+score).slice(-4));
  lcd(302,8,70,'のこり', ('0'+Math.max(0,coins)).slice(-2));

  for(let i=0;i<STATIONS.length;i++){
    const g = rampGeom(Math.min(i,RAMPS-1));
    const useExit = (i>=RAMPS);
    const ex = useExit ? g.xExit : g.xEntry, ey = (useExit ? g.yExit : g.yEntry);
    const dir = ((useExit ? g.xExit : g.xEntry) < W/2) ? 1 : -1;
    emoji(STATIONS[i].e, ex + dir*16, ey - 22, 24);
    oval(STATIONS[i].n, ex + dir*16, ey - 4);
  }

  for(let i=0;i<RAMPS;i++){
    const g = rampGeom(i);
    ctx.strokeStyle='#fff'; ctx.lineWidth=13; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(g.xEntry,g.yEntry); ctx.lineTo(g.xExit,g.yExit); ctx.stroke();
    ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(g.xEntry,g.yEntry); ctx.lineTo(g.xExit,g.yExit); ctx.stroke(); ctx.setLineDash([]);
    const dz0 = ptOnRamp(g, dzStart(i)), dz1 = ptOnRamp(g, 0.99);
    ctx.strokeStyle='rgba(29,185,84,.9)'; ctx.lineWidth=13; ctx.lineCap='butt';
    ctx.beginPath(); ctx.moveTo(dz0.x,dz0.y); ctx.lineTo(dz1.x,dz1.y); ctx.stroke();
    const hc = ptOnRamp(g, (HOLE.u0+HOLE.u1)/2);
    ctx.fillStyle='#181818'; ctx.beginPath(); ctx.ellipse(hc.x,hc.y,12,7,0,0,6.283); ctx.fill();
    const ec = ptOnRamp(g, 1.06);
    ctx.fillStyle='#181818'; ctx.beginPath(); ctx.arc(ec.x,ec.y+6,8,0,6.283); ctx.fill();
  }
  ctx.fillStyle='#c0392b'; ctx.font='bold 12px "Yu Gothic",system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('▼ スタート', M+34, TOP-16);
  ctx.fillStyle='#1a7a3a'; ctx.fillText('ゴール ▶', rampGeom(RAMPS-1).xExit, rampGeom(RAMPS-1).yExit+30);

  if(state==='play'){ const p=coinXY(); drawCoin(p.x,p.y); }
  for(const s of sparkle){ ctx.globalAlpha=Math.max(0,s.life/24); ctx.fillStyle='#fff6c0'; ctx.fillRect(s.x-1.5,s.y-1.5,3,3); }
  ctx.globalAlpha=1;

  drawLever();

  if(state==='play'){
    ctx.fillStyle='#5a4410'; ctx.font='bold 11px "Yu Gothic",system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(STATIONS[coin.i].n+' → '+STATIONS[coin.i+1].n, W/2-20, H-6);
  }

  if(state!=='play'){
    ctx.fillStyle='rgba(20,16,6,.75)'; rr(28,H/2-126,W-56,252,14); ctx.fill();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    if(state==='title'){
      ctx.fillStyle='#fff'; ctx.font='bold 24px "Yu Gothic",system-ui,sans-serif'; ctx.fillText('10円ゲーム',W/2,H/2-80);
      ctx.fillStyle='#f2e2a8'; ctx.font='13px "Yu Gothic",system-ui'; ctx.fillText('レバーを引いて10円玉を転がす',W/2,H/2-48);
      ctx.fillStyle='#7ae0a0'; ctx.font='12px "Yu Gothic",system-ui'; ctx.fillText('長押し＝引く／離すと止まる',W/2,H/2-24);
      ctx.fillStyle='rgba(255,255,255,.8)'; ctx.font='12px "Yu Gothic",system-ui'; ctx.fillText('穴は勢いで越え、緑のゾーンで止めて次の段へ',W/2,H/2+0);
      ctx.fillStyle='rgba(255,255,255,.7)'; ctx.font='11px "Yu Gothic",system-ui'; ctx.fillText('行き過ぎ＝落下／穴で減速＝落下（のこり−1）',W/2,H/2+22);
      ctx.fillStyle='#f2c020'; ctx.font='bold 14px system-ui'; ctx.fillText('タップ / スペースで開始',W/2,H/2+62);
    } else {
      const fade=Math.min(1,endT/12); ctx.globalAlpha=fade;
      if(state==='win'){ ctx.fillStyle='#f2c020'; ctx.font='bold 26px "Yu Gothic",system-ui,sans-serif'; ctx.fillText('大当たり！',W/2,H/2-54);
        ctx.fillStyle='#7ae0a0'; ctx.font='14px "Yu Gothic",system-ui'; ctx.fillText('工場に到着！10円が戻った！',W/2,H/2-22); }
      else if(state==='out'){ ctx.fillStyle='#ff6a4a'; ctx.font='bold 26px "Yu Gothic",system-ui,sans-serif'; ctx.fillText('アウト！',W/2,H/2-54);
        ctx.fillStyle='#fff'; ctx.font='14px "Yu Gothic",system-ui'; ctx.fillText('到達：'+STATIONS[coin.i].n+'　（のこり '+coins+'）',W/2,H/2-22); }
      else { ctx.fillStyle='#ff6a4a'; ctx.font='bold 24px "Yu Gothic",system-ui,sans-serif'; ctx.fillText('ゲームオーバー',W/2,H/2-54);
        ctx.fillStyle='#fff'; ctx.font='14px "Yu Gothic",system-ui'; ctx.fillText('コインを使い切った…',W/2,H/2-22); }
      ctx.fillStyle='#f2c020'; ctx.font='16px system-ui'; ctx.fillText('SCORE '+score,W/2,H/2+10);
      ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='12px system-ui'; ctx.fillText('BEST '+best,W/2,H/2+34);
      ctx.fillStyle='#f2c020'; ctx.font='bold 13px system-ui'; ctx.fillText(state==='over'?'タップでもう一度':'タップで次のコイン',W/2,H/2+68);
      ctx.globalAlpha=1;
    }
  }
  ctx.fillStyle='rgba(90,68,16,.5)'; ctx.font='7px system-ui'; ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText('juen v3',5,6);
  ctx.restore();
}
function loop(){ update(); draw(); requestAnimationFrame(loop); }
resize(); loop();
</script>
</body>
</html>

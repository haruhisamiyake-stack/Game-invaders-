<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#e9c23b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>10円ゲーム — 新幹線でGO</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#c99a1e;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
  #cv{background:#e9c23b;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:100%;max-height:100%}
  #back{position:fixed;left:10px;top:8px;z-index:5;font-size:12px;color:#5a4a10;
    background:rgba(255,255,255,.75);border:1px solid #b9962a;border-radius:20px;
    padding:5px 12px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<a id="back" href="https://shorui-invader.web.app/">← 書類インベーダー</a>
<div id="wrap"><canvas id="cv"></canvas></div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
// board aspect from reference image 1290x1489
const BW=1290, BH=1489, ASPECT=BW/BH;      // ~0.866
let CW=430, CH=Math.round(CW/ASPECT);

const board=new Image(); board.src='board.png?v=5'; let boardReady=false;
board.onload=()=>{boardReady=true;};

/* ---- course: checkpoints in board-percent coords tracing the real path ---- */
const CP=[
  {n:'スタート', x:38, y:88, start:true, pts:0},
  {n:'相撲',     x:18, y:85, pts:100},
  {n:'港',       x:7,  y:70, pts:100},
  {n:'船',       x:21, y:60, pts:150},
  {n:'お寺',     x:9,  y:46, pts:150},
  {n:'スカイツリー', x:16, y:29, pts:200},
  {n:'東京駅',   x:10, y:18, pts:200},
  {n:'スポーツ', x:52, y:20, pts:250},
  {n:'富士山',   x:83, y:16, pts:300},
  {n:'お城',     x:87, y:32, pts:250},
  {n:'神社',     x:38, y:34, pts:200},
  {n:'たこやき', x:59, y:44, pts:200},
  {n:'灯台',     x:86, y:56, pts:250},
  {n:'東京タワー', x:46, y:57, pts:300},
  {n:'工場',     x:91, y:84, pts:300},
  {n:'ゴール',   x:47, y:88, goal:true, pts:1000},
];
/* holes (hazards) in board-percent coords, r in board-% of width */
const HOLES=[
  {x:9, y:38, r:4.6}, {x:49,y:42,r:3.6}, {x:86,y:47,r:3.3},
  {x:7, y:62, r:4.6}, {x:55,y:63,r:3.6}, {x:18,y:79,r:4.2},
  {x:43,y:80,r:3.2}, {x:30,y:73,r:3.0}, {x:70,y:70,r:3.2},
];

/* ---- geometry built on resize ---- */
let P=[], cumS=[], segLenMax=1, DIST_MAX=1, holeArc=[], captureR=1;
function bx(p){return p.x/100*CW;}
function by(p){return p.y/100*CH;}
function nearestOnPath(px,py){
  let best={s:0,d:1e9};
  for(let i=0;i<P.length-1;i++){
    const a=P[i], b=P[i+1];
    const dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy||1;
    let t=((px-a.x)*dx+(py-a.y)*dy)/L2; t=Math.max(0,Math.min(1,t));
    const qx=a.x+dx*t, qy=a.y+dy*t;
    const d=Math.hypot(px-qx,py-qy);
    if(d<best.d) best={s:cumS[i]+Math.hypot(qx-a.x,qy-a.y), d};
  }
  return best;
}
function ptAt(s){
  s=Math.max(0,Math.min(cumS[cumS.length-1],s));
  for(let i=0;i<P.length-1;i++){
    if(s<=cumS[i+1]){
      const a=P[i],b=P[i+1], seg=cumS[i+1]-cumS[i]||1, t=(s-cumS[i])/seg;
      return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t};
    }
  }
  return {x:P[P.length-1].x, y:P[P.length-1].y};
}
function buildGeom(){
  P=CP.map(p=>({x:bx(p),y:by(p)}));
  cumS=[0];
  for(let i=1;i<P.length;i++) cumS[i]=cumS[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);
  segLenMax=0;
  for(let i=1;i<CP.length;i++) segLenMax=Math.max(segLenMax,cumS[i]-cumS[i-1]);
  captureR=Math.min(30, CW*0.058);
  DIST_MAX=segLenMax+captureR*0.7;
  holeArc=HOLES.map(h=>{
    const hx=h.x/100*CW, hy=h.y/100*CH, hr=h.r/100*CW;
    const np=nearestOnPath(hx,hy);
    return {x:hx,y:hy,r:hr,s:np.s};
  });
}
function resize(){
  const availW=Math.min(window.innerWidth-12, 460);
  const availH=window.innerHeight-12;
  CW=Math.min(availW, availH*ASPECT);
  CH=CW/ASPECT;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=CW*dpr; cv.height=CH*dpr; cv.style.width=CW+'px'; cv.style.height=CH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildGeom();
}
window.addEventListener('resize',resize);

/* ---- audio ---- */
let AC=null;
function beep(f,d,t,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),ga=AC.createGain();o.type=t||'square';o.frequency.value=f;
  o.connect(ga);ga.connect(AC.destination);const n=AC.currentTime;
  ga.gain.setValueAtTime(0,n);ga.gain.linearRampToValueAtTime(g||0.15,n+0.01);
  ga.gain.exponentialRampToValueAtTime(0.0001,n+(d||0.12));o.start(n);o.stop(n+(d||0.12)+0.02);}catch(e){}}
function sfxCharge(p){beep(300+p*6,0.05,'square',0.05);}
function sfxRoll(){beep(520,0.08,'triangle',0.12);}
function sfxScore(){beep(880,0.09,'square',0.16);setTimeout(()=>beep(1320,0.12,'square',0.16),80);}
function sfxFail(){beep(200,0.25,'sawtooth',0.18);setTimeout(()=>beep(140,0.3,'sawtooth',0.16),120);}
function sfxWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.18),i*130));}

/* ---- game state ---- */
let G;
function reset(){
  G={state:'ready', coinS:0, reached:0, score:0, coins:8,
     power:0, pdir:1, vel:0, msg:'', msgT:0, pop:[], t:0, flash:0};
}
reset();

/* input */
function startCharge(){ if(G.state==='ready'){G.state='charging';G.power=0;G.pdir=1;} }
function release(){
  if(G.state==='charging'){
    G.state='rolling';
    const D=G.power/100*DIST_MAX*(0.97+Math.random()*0.06);
    G.vel=Math.sqrt(2*0.22*Math.max(4,D));
    sfxRoll();
  }
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(G.state==='won'||G.state==='over'){reset();return;} startCharge();});
cv.addEventListener('pointerup',e=>{e.preventDefault();release();});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();
    if(G.state==='won'||G.state==='over'){reset();return;}
    if(G.state==='ready')startCharge();}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();release();}});

function popText(s,txt,col){const p=ptAt(s);G.pop.push({x:p.x,y:p.y,txt,col,t:0});}

/* ---- update ---- */
function update(){
  G.t++;
  if(G.flash>0)G.flash--;
  if(G.msgT>0)G.msgT--;
  G.pop=G.pop.filter(p=>{p.t++;p.y-=0.5;return p.t<70;});
  if(G.state==='charging'){
    G.power+=2.4*G.pdir;
    if(G.power>=100){G.power=100;G.pdir=-1;}
    if(G.power<=0){G.power=0;G.pdir=1;}
    if(G.t%4===0)sfxCharge(G.power);
  } else if(G.state==='rolling'){
    G.coinS+=G.vel; G.vel-=0.22;
    const totalL=cumS[cumS.length-1];
    if(G.coinS>=totalL){G.coinS=totalL;G.vel=0;}
    if(G.vel<=0){G.vel=0;resolveRest();}
  }
}
function resolveRest(){
  const s=G.coinS;
  if(s>=cumS[CP.length-1]-captureR){ collect(CP.length-1); winGame(); return; }
  const nextIdx=G.reached+1, nextS=cumS[nextIdx];
  const rp=ptAt(s);
  for(const h of holeArc){ if(Math.hypot(rp.x-h.x,rp.y-h.y)<h.r){ failCoin('穴に落ちた！'); return; } }
  if(s>=nextS-captureR && s<=nextS+captureR){ collect(nextIdx); G.state='ready'; return; }
  if(s>nextS+captureR){ failCoin('行き過ぎ！'); return; }
  G.state='ready'; G.msg='もう一歩！'; G.msgT=60;
}
function collect(idx){
  while(G.reached<idx){
    G.reached++; const c=CP[G.reached]; G.score+=c.pts;
    if(!c.goal) popText(cumS[G.reached],'+'+c.pts,'#2e7d32');
    G.coinS=cumS[G.reached];
  }
  sfxScore(); G.flash=8;
  if(!CP[idx].goal){G.msg=CP[idx].n+' 到着！';G.msgT=70;}
}
function failCoin(reason){
  G.coins--; sfxFail(); popText(G.coinS,'MISS','#c0392b');
  G.msg=reason; G.msgT=80; G.flash=12;
  if(G.coins<=0){ G.state='over'; return; }
  G.coinS=cumS[G.reached]; G.state='ready';
}
function winGame(){G.state='won';G.score+=G.coins*200;sfxWin();}
function targetBand(){
  const nextS=cumS[Math.min(G.reached+1,CP.length-1)];
  const need=nextS-G.coinS;
  const lo=(need-captureR)/DIST_MAX*100, hi=(need+captureR*0.6)/DIST_MAX*100;
  return [Math.max(0,Math.min(100,lo)), Math.max(0,Math.min(100,hi))];
}

/* ---- draw ---- */
function draw(){
  ctx.clearRect(0,0,CW,CH);
  if(boardReady) ctx.drawImage(board,0,0,CW,CH);
  else { ctx.fillStyle='#e9c23b'; ctx.fillRect(0,0,CW,CH); }

  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.28)'; ctx.lineWidth=Math.max(6,CW*0.02);
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); P.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
  ctx.strokeStyle='rgba(40,40,40,.5)'; ctx.lineWidth=Math.max(2,CW*0.006);
  ctx.setLineDash([CW*0.02,CW*0.02]);
  ctx.beginPath(); P.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();

  const nextIdx=Math.min(G.reached+1,CP.length-1);
  CP.forEach((c,i)=>{
    if(i===0)return;
    const x=bx(c),y=by(c);
    if(i<=G.reached){ ring(x,y,captureR*0.7,'rgba(46,125,50,.9)',3); }
    else if(i===nextIdx){ ctx.fillStyle='rgba(255,90,90,.15)';ctx.beginPath();ctx.arc(x,y,captureR,0,7);ctx.fill();
      ring(x,y,captureR,'rgba(255,70,70,.95)',4); }
  });

  const cp=ptAt(G.coinS);
  drawCoin(cp.x, cp.y, CW*0.045);

  G.pop.forEach(p=>{ctx.globalAlpha=Math.max(0,1-p.t/70);ctx.fillStyle=p.col;
    ctx.font='bold '+Math.round(CW*0.05)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;});

  drawHUD(); drawMeter();
  if(G.msgT>0) drawBanner(G.msg);
  if(G.state==='won') drawEnd('🎉 ゴール！ 🎉','スコア '+G.score,'#2e7d32');
  if(G.state==='over') drawEnd('GAME OVER','スコア '+G.score,'#c0392b');
}
function ring(x,y,r,c,w){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();}
function drawCoin(x,y,r){
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=6;ctx.shadowOffsetY=3;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.2,0,0,r);
  g.addColorStop(0,'#ffe9a0');g.addColorStop(.6,'#d9a92a');g.addColorStop(1,'#a97b12');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.shadowColor='transparent';
  ctx.strokeStyle='#8a6410';ctx.lineWidth=r*0.12;ctx.beginPath();ctx.arc(0,0,r*0.82,0,7);ctx.stroke();
  ctx.fillStyle='#7a560e';ctx.font='bold '+Math.round(r*0.95)+'px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('10',0,r*0.06);
  ctx.restore();ctx.textBaseline='alphabetic';
}
function drawHUD(){
  // cover the board's printed digits, then draw live values aligned to the panels
  ctx.fillStyle='#0a0a0a';
  ctx.fillRect(CW*0.636,CH*0.050,CW*0.145,CH*0.036);
  ctx.fillRect(CW*0.842,CH*0.050,CW*0.079,CH*0.036);
  ctx.fillStyle='#ff5a4a';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(CW*0.045)+'px "Courier New",monospace';
  ctx.fillText(String(G.score).padStart(4,'0'), CW*0.708, CH*0.069);
  ctx.fillText(String(Math.max(0,G.coins)).padStart(2,'0'), CW*0.881, CH*0.069);
  ctx.textBaseline='alphabetic';
}
function drawMeter(){
  const mw=CW*0.7, mh=Math.max(16,CH*0.03), mx=(CW-mw)/2, my=CH*0.945;
  ctx.fillStyle='rgba(0,0,0,.55)';roundRect(mx-6,my-6,mw+12,mh+12,8);ctx.fill();
  ctx.fillStyle='#222';roundRect(mx,my,mw,mh,6);ctx.fill();
  const [lo,hi]=targetBand();
  ctx.fillStyle='rgba(60,220,90,.85)';
  ctx.fillRect(mx+mw*lo/100,my,mw*(hi-lo)/100,mh);
  const pf=G.state==='charging'?G.power:0;
  ctx.fillStyle=G.power>hi?'#ff5a4a':(G.power>=lo?'#3cdc5a':'#ffd23f');
  ctx.fillRect(mx,my,mw*pf/100,mh);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;roundRect(mx,my,mw,mh,6);ctx.stroke();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold '+Math.round(CW*0.034)+'px sans-serif';
  const hint = G.state==='ready' ? '押し続けて離す＝発射' :
               G.state==='charging' ? 'パワー '+Math.round(G.power) : '';
  ctx.fillText(hint, CW/2, my-12);
}
function drawBanner(txt){
  ctx.save();ctx.globalAlpha=Math.min(1,G.msgT/20);
  ctx.fillStyle='rgba(0,0,0,.7)';const w=CW*0.72,h=CH*0.06,x=(CW-w)/2,y=CH*0.43;
  roundRect(x,y,w,h,10);ctx.fill();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(CW*0.05)+'px sans-serif';ctx.fillText(txt,CW/2,y+h/2);
  ctx.restore();ctx.textBaseline='alphabetic';
}
function drawEnd(title,sub,col){
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center';ctx.fillStyle=col==='#2e7d32'?'#8ef0a0':'#ff8a8a';
  ctx.font='bold '+Math.round(CW*0.1)+'px sans-serif';ctx.fillText(title,CW/2,CH*0.44);
  ctx.fillStyle='#fff';ctx.font='bold '+Math.round(CW*0.06)+'px sans-serif';ctx.fillText(sub,CW/2,CH*0.53);
  ctx.font=Math.round(CW*0.04)+'px sans-serif';ctx.fillText('タップでもう一度',CW/2,CH*0.6);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function loop(){update();draw();requestAnimationFrame(loop);}
resize();loop();
</script>
</body>
</html>

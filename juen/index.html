<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#e9c23b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>10円ゲーム — 新幹線でGO</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#c99a1e;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
  #cv{background:#e9c23b;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:100%;max-height:100%}
  #back{position:fixed;left:10px;top:8px;z-index:5;font-size:12px;color:#5a4a10;
    background:rgba(255,255,255,.75);border:1px solid #b9962a;border-radius:20px;
    padding:5px 12px;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<a id="back" href="https://shorui-invader.web.app/">← 書類インベーダー</a>
<div id="wrap"><canvas id="cv"></canvas></div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const BW=1290, BH=1489, ASPECT=BW/BH;
let CW=430, CH=Math.round(CW/ASPECT);
const board=new Image(); board.src='board.png?v=5'; let boardReady=false;
board.onload=()=>{boardReady=true;};

/* course = the intended red line. Coin rolls DOWN (gravity) from 東京駅 to ゴール. */
const WP=[[8.5,19.6],[45.4,21.4],[75.0,25.4],[89.2,31.9],[87.7,34.8],[70.2,36.0],[51.3,35.5],[28.5,38.6],[13.8,43.8],[5.6,49.6],[8.6,50.5],[16.2,48.8],[50.0,52.3],[86.9,60.5],[93.6,64.3],[94.3,66.5],[52.7,58.6],[37.2,57.5],[13.0,65.9],[3.5,73.5],[8.2,74.9],[59.7,75.9],[65.7,74.9],[91.2,89.1],[91.6,90.8],[87.2,91.2],[78.4,89.4],[70.3,89.5],[61.0,86.8],[49.0,86.2],[38.9,87.8],[33.6,92.5],[35.3,99.8]];
const LM=[{n:"東京駅",i:0,pts:0},{n:"スポーツ",i:1,pts:150},{n:"お城",i:3,pts:250},{n:"神社",i:6,pts:200},{n:"お寺",i:9,pts:200},{n:"東京タワー",i:12,pts:250},{n:"灯台",i:13,pts:300},{n:"工場",i:23,pts:300},{n:"ゴール",i:32,pts:1000}];
const HOLES=[{x:9,y:38,r:4.6},{x:49,y:42,r:3.6},{x:7,y:62,r:4.6},{x:55,y:63,r:3.6},
  {x:18,y:79,r:4.2},{x:43,y:80,r:3.2},{x:30,y:73,r:3.0}];

/* geometry + physics constants (weight/gravity based) */
let P=[],cumS=[],segTY=[],lmS=[],totalL=1,holePx=[],failZones=[];
let GRAV=0,FRICTION=0,VMAX=0,VSTOP=0,STATIC=0;
function ptAt(s){
  s=Math.max(0,Math.min(totalL,s));
  for(let i=0;i<P.length-1;i++){
    if(s<=cumS[i+1]){const a=P[i],b=P[i+1],seg=cumS[i+1]-cumS[i]||1,t=(s-cumS[i])/seg;
      return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};}
  }
  return {x:P[P.length-1].x,y:P[P.length-1].y};
}
function tanY(s){ // downhill (+screen y) component of unit tangent at arc s
  for(let i=0;i<P.length-1;i++){ if(s<=cumS[i+1]) return segTY[i]; }
  return segTY[segTY.length-1];
}
function buildGeom(){
  P=WP.map(p=>({x:p[0]/100*CW,y:p[1]/100*CH}));
  cumS=[0]; for(let i=1;i<P.length;i++) cumS[i]=cumS[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y);
  totalL=cumS[cumS.length-1];
  segTY=[]; for(let i=0;i<P.length-1;i++){const dx=P[i+1].x-P[i].x,dy=P[i+1].y-P[i].y,L=Math.hypot(dx,dy)||1;segTY.push(dy/L);}
  lmS=LM.map(l=>cumS[l.i]);
  holePx=HOLES.map(h=>({x:h.x/100*CW,y:h.y/100*CH,r:h.r/100*CW}));
  // weight physics (scaled to course length so it feels identical at any size)
  FRICTION=totalL*0.000060;   // rolling resistance (opposes motion)
  GRAV    =totalL*0.000115;   // pull down the incline
  STATIC  =FRICTION*1.15;     // holds coin on gentle slopes; steep drops can't be rested on
  VMAX    =totalL*0.0078;     // launch impulse at full power
  VSTOP   =totalL*0.00010;
  // hazard zones: arc ranges where the path passes near a hole (don't stop here)
  failZones=[]; const step=totalL/500; let open=null;
  for(let s=0;s<=totalL;s+=step){
    const rp=ptAt(s); let haz=false;
    for(const h of holePx){ if(Math.hypot(rp.x-h.x,rp.y-h.y)<h.r+CW*0.028){haz=true;break;} }
    if(haz&&open===null)open=s;
    else if(!haz&&open!==null){failZones.push([open,s]);open=null;}
  }
  if(open!==null)failZones.push([open,totalL]);
}
function inHazard(s){for(const z of failZones)if(s>=z[0]&&s<=z[1])return true;return false;}
function resize(){
  const availW=Math.min(window.innerWidth-12,460),availH=window.innerHeight-12;
  CW=Math.min(availW,availH*ASPECT); CH=CW/ASPECT;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=CW*dpr; cv.height=CH*dpr; cv.style.width=CW+'px'; cv.style.height=CH+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0); buildGeom(); if(G)computeBand();
}
window.addEventListener('resize',resize);

/* physics step: advance one frame from (s,v); returns [s,v,resting] */
function physStep(s,v){
  const ty=tanY(s), grav=GRAV*ty;
  if(Math.abs(v)<VSTOP){
    if(Math.abs(grav)<=STATIC) return [s,0,true];   // slope too gentle -> rests
    v+=grav;                                          // steep -> starts/keeps rolling
  } else {
    v+=grav - FRICTION*Math.sign(v);
  }
  s+=v;
  return [s,v,false];
}
/* deterministic simulation of a launch at given power -> stop arc (for the aim guide) */
function simulate(power){
  let s=G.coinS, v=power/100*VMAX, r=false;
  for(let k=0;k<2500 && !r;k++){
    [s,v,r]=physStep(s,v);
    if(s>=totalL) return totalL;
    if(s<0){s=0;break;}
  }
  return s;
}

/* audio */
let AC=null;
function beep(f,d,t,g){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),ga=AC.createGain();o.type=t||'square';o.frequency.value=f;
  o.connect(ga);ga.connect(AC.destination);const n=AC.currentTime;
  ga.gain.setValueAtTime(0,n);ga.gain.linearRampToValueAtTime(g||0.15,n+0.01);
  ga.gain.exponentialRampToValueAtTime(0.0001,n+(d||0.12));o.start(n);o.stop(n+(d||0.12)+0.02);}catch(e){}}
function sfxCharge(p){beep(300+p*6,0.05,'square',0.05);}
function sfxRoll(){beep(520,0.08,'triangle',0.12);}
function sfxScore(){beep(880,0.09,'square',0.16);setTimeout(()=>beep(1320,0.12,'square',0.16),80);}
function sfxFail(){beep(200,0.25,'sawtooth',0.18);setTimeout(()=>beep(140,0.3,'sawtooth',0.16),120);}
function sfxWin(){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'square',0.2),i*140));}

/* state */
let G=null;
function reset(){G={state:'ready',coinS:0,vel:0,reached:0,score:0,coins:8,power:0,pdir:1,msg:'',msgT:0,pop:[],t:0,flash:0,samples:[]};computeBand();}

/* aim guide: sample powers, mark which land safely & make progress */
function computeBand(){
  if(!G)return; const arr=[];
  for(let p=0;p<=100;p+=2){
    const st=simulate(p);
    const win=st>=totalL-2;
    const safe=win||!inHazard(st);
    const progress=st>G.coinS+totalL*0.012;
    arr.push({p,st,good:(safe&&progress)||win});
  }
  G.samples=arr;
}
/* best contiguous good band (reaching furthest) for hint/bot */
function targetBand(){
  if(!G.samples.length)return[0,0];
  let bi=-1,bst=-1;
  for(let i=0;i<G.samples.length;i++){if(G.samples[i].good&&G.samples[i].st>bst){bst=G.samples[i].st;bi=i;}}
  if(bi<0)return[0,0];
  let lo=bi,hi=bi;
  while(lo>0&&G.samples[lo-1].good)lo--;
  while(hi<G.samples.length-1&&G.samples[hi+1].good)hi++;
  return[G.samples[lo].p,G.samples[hi].p];
}

function startCharge(){if(G.state==='ready'){G.state='charging';G.power=0;G.pdir=1;}}
function release(){if(G.state==='charging'){G.state='rolling';
  G.vel=(G.power/100)*VMAX*(0.97+Math.random()*0.06); sfxRoll();}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();
  if(G.state==='won'||G.state==='over'){reset();return;} startCharge();});
cv.addEventListener('pointerup',e=>{e.preventDefault();release();});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();
  if(G.state==='won'||G.state==='over'){reset();return;} if(G.state==='ready')startCharge();}});
window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();release();}});
function popText(s,txt,col){const p=ptAt(s);G.pop.push({x:p.x,y:p.y,txt,col,t:0});}

function update(){
  G.t++; if(G.flash>0)G.flash--; if(G.msgT>0)G.msgT--;
  G.pop=G.pop.filter(p=>{p.t++;p.y-=0.5;return p.t<70;});
  if(G.state==='charging'){
    G.power+=2.3*G.pdir;
    if(G.power>=100){G.power=100;G.pdir=-1;}
    if(G.power<=0){G.power=0;G.pdir=1;}
    if(G.t%4===0)sfxCharge(G.power);
  }else if(G.state==='rolling'){
    const prev=G.coinS; let r;
    [G.coinS,G.vel,r]=physStep(G.coinS,G.vel);
    if(G.coinS>=totalL){G.coinS=totalL;winGame();return;}
    if(G.coinS<0)G.coinS=0;
    // score landmarks on forward pass
    for(let k=G.reached+1;k<LM.length;k++){
      if(lmS[k]<=G.coinS && lmS[k]>prev){
        G.reached=k; if(k<LM.length-1){G.score+=LM[k].pts;popText(lmS[k],'+'+LM[k].pts,'#1b7a2e');sfxScore();}
      }
    }
    if(r){G.vel=0;resolveRest();}
  }
}
function resolveRest(){
  if(inHazard(G.coinS)){failCoin('穴に落ちた！');return;}
  G.state='ready'; computeBand();
  if(!G.samples.some(s=>s.good)){G.msg='弱く当てて手前で止めよう';G.msgT=70;}
}
function failCoin(reason){
  G.coins--; sfxFail(); popText(G.coinS,'MISS','#c0392b');
  G.msg=reason; G.msgT=90; G.flash=14;
  if(G.coins<=0){G.state='over';return;}
  G.coinS=lmS[G.reached]; G.vel=0; G.state='ready'; computeBand();
}
function winGame(){G.state='won';G.reached=LM.length-1;G.score+=1000+G.coins*200;sfxWin();G.flash=20;}

/* draw */
function draw(){
  ctx.clearRect(0,0,CW,CH);
  if(boardReady) ctx.drawImage(board,0,0,CW,CH);
  else {ctx.fillStyle='#e9c23b';ctx.fillRect(0,0,CW,CH);}

  if(G.state==='ready'||G.state==='charging'){
    // warn about the next hole the coin could stop in within reach
    const maxReach=G.samples.length?Math.max(...G.samples.map(s=>s.st)):G.coinS;
    for(const z of failZones){ if(z[1]>G.coinS+2 && z[0]<maxReach){
      const m=ptAt((z[0]+z[1])/2), pr=CW*0.045*(1+0.12*Math.sin(G.t*0.2));
      ctx.strokeStyle='rgba(220,40,40,.9)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(m.x,m.y,pr,0,7);ctx.stroke();
      ctx.fillStyle='rgba(220,40,40,.95)';ctx.font='bold '+Math.round(CW*0.05)+'px sans-serif';
      ctx.textAlign='center';ctx.fillText('!',m.x,m.y+CW*0.018);
      break; } }
  }
  const gp=ptAt(totalL);
  ctx.strokeStyle='rgba(30,150,60,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(gp.x,gp.y,CW*0.05,0,7);ctx.stroke();

  const cp=ptAt(G.coinS);
  drawCoin(cp.x,cp.y,CW*0.043);

  G.pop.forEach(p=>{ctx.globalAlpha=Math.max(0,1-p.t/70);ctx.fillStyle=p.col;
    ctx.font='bold '+Math.round(CW*0.05)+'px sans-serif';ctx.textAlign='center';
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;ctx.strokeText(p.txt,p.x,p.y);
    ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;});

  drawHUD(); drawMeter();
  if(G.msgT>0)drawBanner(G.msg);
  if(G.state==='won')drawEnd('🎉 ゴール！ 🎉','スコア '+G.score,true);
  if(G.state==='over')drawEnd('GAME OVER','スコア '+G.score,false);
}
function drawCoin(x,y,r){
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=7;ctx.shadowOffsetY=3;
  const g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.2,0,0,r);
  g.addColorStop(0,'#ffe9a0');g.addColorStop(.6,'#d9a92a');g.addColorStop(1,'#a97b12');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.shadowColor='transparent';
  ctx.strokeStyle='#8a6410';ctx.lineWidth=r*0.13;ctx.beginPath();ctx.arc(0,0,r*0.82,0,7);ctx.stroke();
  // spin marks convey rolling weight
  ctx.save();ctx.rotate(G.coinS*0.05);
  ctx.strokeStyle='rgba(122,86,14,.5)';ctx.lineWidth=r*0.08;
  for(let a=0;a<3;a++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a*2.1)*r*0.6,Math.sin(a*2.1)*r*0.6);ctx.stroke();}
  ctx.restore();
  ctx.fillStyle='#7a560e';ctx.font='bold '+Math.round(r*0.85)+'px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('10',0,r*0.06);
  ctx.restore();ctx.textBaseline='alphabetic';
}
function drawHUD(){
  ctx.fillStyle='#0a0a0a';
  ctx.fillRect(CW*0.636,CH*0.050,CW*0.145,CH*0.036);
  ctx.fillRect(CW*0.842,CH*0.050,CW*0.079,CH*0.036);
  ctx.fillStyle='#ff5a4a';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(CW*0.045)+'px "Courier New",monospace';
  ctx.fillText(String(G.score).padStart(4,'0'),CW*0.708,CH*0.069);
  ctx.fillText(String(Math.max(0,G.coins)).padStart(2,'0'),CW*0.881,CH*0.069);
  ctx.textBaseline='alphabetic';
}
function drawMeter(){
  const mw=CW*0.72,mh=Math.max(16,CH*0.03),mx=(CW-mw)/2,my=CH*0.955;
  ctx.fillStyle='rgba(0,0,0,.6)';roundRect(mx-6,my-6,mw+12,mh+12,8);ctx.fill();
  ctx.fillStyle='#222';roundRect(mx,my,mw,mh,6);ctx.fill();
  // green segments = powers that land safely & progress (from physics sim)
  ctx.fillStyle='rgba(60,220,90,.85)';
  for(const s of G.samples){ if(s.good) ctx.fillRect(mx+mw*s.p/100-mw*0.01,my,mw*0.022,mh); }
  const pf=G.state==='charging'?G.power:0;
  const nowGood=G.samples.some(s=>s.good&&Math.abs(s.p-G.power)<=2);
  ctx.fillStyle=nowGood?'#3cdc5a':'#ffd23f';
  ctx.fillRect(mx,my,mw*pf/100,mh);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;roundRect(mx,my,mw,mh,6);ctx.stroke();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold '+Math.round(CW*0.032)+'px sans-serif';
  const hint=G.state==='ready'?'押し続けて離す＝発射（緑で止める）':G.state==='charging'?'パワー '+Math.round(G.power):'コロコロ…';
  ctx.fillText(hint,CW/2,my-9);
}
function drawBanner(txt){
  ctx.save();ctx.globalAlpha=Math.min(1,G.msgT/20);
  ctx.fillStyle='rgba(0,0,0,.72)';const w=CW*0.74,h=CH*0.06,x=(CW-w)/2,y=CH*0.42;
  roundRect(x,y,w,h,10);ctx.fill();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(CW*0.05)+'px sans-serif';ctx.fillText(txt,CW/2,y+h/2);
  ctx.restore();ctx.textBaseline='alphabetic';
}
function drawEnd(title,sub,win){
  ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,0,CW,CH);
  ctx.textAlign='center';ctx.fillStyle=win?'#8ef0a0':'#ff8a8a';
  ctx.font='bold '+Math.round(CW*0.1)+'px sans-serif';ctx.fillText(title,CW/2,CH*0.44);
  ctx.fillStyle='#fff';ctx.font='bold '+Math.round(CW*0.06)+'px sans-serif';ctx.fillText(sub,CW/2,CH*0.53);
  ctx.font=Math.round(CW*0.04)+'px sans-serif';ctx.fillText('タップでもう一度',CW/2,CH*0.6);
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function loop(){update();draw();requestAnimationFrame(loop);}
resize();reset();loop();
</script>
</body>
</html>

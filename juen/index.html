<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#123a63">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>10円ゲーム — レバーでレールを動かせ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0d2136;overflow:hidden;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
  #cabinet{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:6px;
    background:
      radial-gradient(120% 80% at 50% 0%, #1e4f82 0%, #123a63 45%, #0c2a44 100%),
      repeating-linear-gradient(90deg,#0e2f52 0 8px,#0c2b4c 8px 16px);}
  #frame{position:relative;border-radius:16px;padding:10px 10px 8px;
    background:linear-gradient(180deg,#2a628f,#17436e);
    box-shadow:0 10px 40px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.25), inset 0 -4px 12px rgba(0,0,0,.5);
    border:2px solid #0a2540;max-width:100%;max-height:100%;}
  #marquee{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 6px;
    font-weight:900;letter-spacing:2px;color:#ffe36b;text-shadow:0 2px 0 #a9791b,0 0 12px #ffcf3f;
    font-size:clamp(15px,4.6vw,22px)}
  #marquee .c{display:inline-block;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ffe9a0,#c9971f);border:2px solid #8a6410;
    color:#7a560e;font-size:12px;line-height:20px;text-align:center;font-weight:900}
  #stage{position:relative}
  canvas{display:block;border-radius:10px;background:#0b2036;
    box-shadow:inset 0 0 0 3px #0a2540, 0 4px 14px rgba(0,0,0,.5)}
  #hud{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:center;gap:22px;
    padding:0 12px;pointer-events:none;font-weight:800;font-size:13px;text-shadow:0 1px 2px #000}
  #sound{position:absolute;top:4px;right:6px;pointer-events:auto;cursor:pointer;
    background:rgba(0,0,0,.45);border:1px solid #6fa8d6;border-radius:16px;color:#cfe6ff;
    font-size:12px;padding:3px 9px;font-weight:700}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:14px;text-align:center;background:rgba(5,16,28,.72);border-radius:10px}
  #overlay.hidden{display:none}
  #overlay h1{margin:0;font-size:clamp(22px,7vw,34px);color:#ffe36b;text-shadow:0 2px 0 #a9791b}
  #overlay p{margin:0;font-size:13px;line-height:1.7;color:#dbeaff;max-width:86%}
  .btn{cursor:pointer;border:none;border-radius:30px;padding:12px 26px;font-size:17px;font-weight:900;
    color:#5a3b00;background:linear-gradient(180deg,#ffe36b,#f0b429);
    box-shadow:0 4px 0 #a9791b,0 6px 14px rgba(0,0,0,.4)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a9791b}
  #back{position:fixed;left:10px;top:8px;z-index:5;font-size:12px;color:#cfe6ff;
    background:rgba(0,0,0,.4);border:1px solid #6fa8d6;border-radius:20px;padding:5px 12px;
    text-decoration:none;font-weight:700}
</style>
</head>
<body>
<a id="back" href="https://shorui-invader.web.app/">← 書類インベーダー</a>
<div id="cabinet">
  <div id="frame">
    <div id="marquee"><span class="c">10</span>円ゲーム</div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hud"><span id="timeL">TIME 99</span><span id="scoreL">SCORE 0</span></div>
      <div id="sound">🔊 音ON</div>
      <div id="overlay">
        <h1>10円ゲーム</h1>
        <p>レバー（A/S/D・J/K/L、画面のレバーをドラッグ）で<br>白いレールを動かし、10円玉をゴールまで運ぼう。<br>押している間だけレールが動き、離すと戻ります。</p>
        <button class="btn" id="startBtn">10円を投入</button>
      </div>
    </div>
  </div>
</div>

<script src="matter.min.js?v=1"></script>
<script>
/* ===================== コースデータ（JSON・差し替え可能） ===================== */
const COURSES = {
  course1: {
    name:"日本一周コース",
    background:"sky",
    timeLimit:99,
    world:{w:440,h:770},
    coinStart:{x:90,y:64},
    goal:{x:58,y:702,w:226,h:62},
    // レール：type と lever(操作するレバーID)。base=静止角/位置、d=可動量。
    // 左レール中心x150(span45..255) / 右レール中心x290(span185..395)。185..255が受け渡し帯。
    rails:[
      {id:"r1",type:"tilt",     x:150,y:158,w:210,h:15,base:0,    d:0.42, lever:"A"},
      {id:"r2",type:"tilt",     x:290,y:252,w:210,h:15,base:0,    d:-0.42,lever:"J"},
      {id:"r3",type:"tilt",     x:150,y:346,w:210,h:15,base:0,    d:0.42, lever:"S"},
      {id:"r4",type:"seesaw",   x:290,y:440,w:214,h:15,base:0,    d:-0.5, lever:"K"},
      {id:"r5",type:"updown",   x:150,y:534,w:210,h:15,base:0,    d:30,   tilt:0.42, lever:"D"},
      {id:"br",type:"bridge",   x:290,y:600,w:150,h:15,base:0,    d:1,    lever:"F"},
      {id:"r6",type:"tilt",     x:220,y:650,w:230,h:15,base:0.05, d:-0.58,lever:"L"}
    ],
    // 黒い穴（落ちたら失敗）— 逆方向へ転がしたときの落下先に配置
    holes:[
      {x:44,y:252,r:23},{x:400,y:346,r:23},{x:44,y:440,r:23},
      {x:400,y:536,r:23},{x:340,y:702,r:22}
    ],
    // 固定の壁（衝突あり）
    walls:[
      {x:3,y:385,w:6,h:770},{x:437,y:385,w:6,h:770}
    ],
    levers:[
      {id:"A",side:"L",cy:206,key:"a",rail:"r1"},
      {id:"S",side:"L",cy:392,key:"s",rail:"r3"},
      {id:"D",side:"L",cy:548,key:"d",rail:"r5"},
      {id:"J",side:"R",cy:300,key:"j",rail:"r2"},
      {id:"K",side:"R",cy:486,key:"k",rail:"r4"},
      {id:"F",side:"L",cy:612,key:"f",rail:"br"},
      {id:"L",side:"R",cy:650,key:"l",rail:"r6"}
    ]
  }
};
let COURSE = COURSES.course1;

/* ===================== セットアップ ===================== */
const {Engine,Bodies,Body,Composite,Vector}=Matter;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const WORLD_W=COURSE.world.w, WORLD_H=COURSE.world.h;
let scaleCss=1;
function fit(){
  const availH=window.innerHeight-118, availW=window.innerWidth-24;
  let w=Math.min(availW, availH*WORLD_W/WORLD_H, 460);
  let h=w*WORLD_H/WORLD_W;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=WORLD_W*dpr; cv.height=WORLD_H*dpr;
  cv.style.width=w+'px'; cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scaleCss=w/WORLD_W;
}
window.addEventListener('resize',fit); fit();

let engine, coin, railBodies={}, wallBodies=[];
let levers=[], railDefs=[], holes=[], goal=COURSE.goal;
let state='title', tLeft=COURSE.timeLimit, score=0, idleT=0, lastY=0, startTime=0;
let soundOn=true, flipPhase=0, lampT=0;

function buildWorld(){
  engine=Engine.create();
  engine.gravity.y=1;
  engine.positionIterations=12; engine.velocityIterations=10; engine.constraintIterations=4;
  railBodies={}; wallBodies=[]; railDefs=COURSE.rails.map(r=>Object.assign({},r));
  holes=COURSE.holes.map(h=>Object.assign({},h));
  goal=COURSE.goal;
  // rails
  for(const r of railDefs){
    const b=Bodies.rectangle(r.x,r.y,r.w,r.h,{isStatic:true,friction:.09,restitution:.05,label:r.id,chamfer:{radius:6}});
    r.baseX=r.x; r.baseY=r.y; r.baseAngle=(r.base||0); r._prevV=0;
    Body.setAngle(b,r.baseAngle);
    railBodies[r.id]=b; Composite.add(engine.world,b);
  }
  // walls
  for(const w of (COURSE.walls||[])){
    const b=Bodies.rectangle(w.x,w.y,w.w,w.h,{isStatic:true,friction:.05,restitution:.2,label:'wall'});
    wallBodies.push(b); Composite.add(engine.world,b);
  }
  // levers
  levers=COURSE.levers.map(l=>Object.assign({value:0,keyDown:false,pointerId:null,cx:(l.side==='L'?26:WORLD_W-26),len:64},l));
  // coin
  coin=Bodies.circle(COURSE.coinStart.x,COURSE.coinStart.y,13,
    {restitution:.14,friction:.06,frictionStatic:.55,frictionAir:.006,density:.02,label:'coin'});
  Composite.add(engine.world,coin);
  lastY=coin.position.y; idleT=0;
}

/* ===================== レバー操作 ===================== */
function leverAt(px,py){
  for(const l of levers){
    if(Math.abs(px-l.cx)<26 && py>l.cy-l.len-14 && py<l.cy+14) return l;
  }
  return null;
}
function toLocal(e){
  const rect=cv.getBoundingClientRect();
  return {x:(e.clientX-rect.left)/scaleCss, y:(e.clientY-rect.top)/scaleCss};
}
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  e.preventDefault(); const p=toLocal(e); const l=leverAt(p.x,p.y);
  if(l){ l.pointerId=e.pointerId; l.value=clamp((l.cy-p.y)/l.len,0,1); try{cv.setPointerCapture(e.pointerId);}catch(_){} }
},{passive:false});
cv.addEventListener('pointermove',e=>{
  const l=levers.find(x=>x.pointerId===e.pointerId); if(!l)return;
  e.preventDefault(); const p=toLocal(e); l.value=clamp((l.cy-p.y)/l.len,0,1);
},{passive:false});
function endPointer(e){ const l=levers.find(x=>x.pointerId===e.pointerId); if(l)l.pointerId=null; }
cv.addEventListener('pointerup',endPointer); cv.addEventListener('pointercancel',endPointer);
window.addEventListener('keydown',e=>{ const l=levers.find(x=>x.key===e.key.toLowerCase()); if(l){l.keyDown=true;e.preventDefault();} });
window.addEventListener('keyup',e=>{ const l=levers.find(x=>x.key===e.key.toLowerCase()); if(l){l.keyDown=false;e.preventDefault();} });

function updateLevers(){
  for(const l of levers){
    if(l.pointerId!==null) continue;              // ドラッグ中は直接値
    const target=l.keyDown?1:0;
    if(target>l.value) l.value=Math.min(1,l.value+0.28);   // 押すと素早く動く
    else l.value+=(target-l.value)*0.09;                   // 離すとバネでゆっくり戻る
    if(l.value<0.001)l.value=0;
  }
}
function railValue(id){ const l=levers.find(x=>x.rail===id); return l?l.value:0; }

/* レール変形をMatterのStaticボディへ適用 */
function applyRails(){
  for(const r of railDefs){
    const v=railValue(r.id), b=railBodies[r.id];
    let x=r.baseX, y=r.baseY, ang=r.baseAngle, sensor=false;
    if(r.type==='tilt'||r.type==='seesaw'){ ang=r.baseAngle + v*r.d; }
    else if(r.type==='updown'||r.type==='elevator'){ y=r.baseY + v*r.d; if(r.tilt)ang=r.baseAngle+v*r.tilt; }
    else if(r.type==='leftright'){ x=r.baseX + v*r.d; }
    else if(r.type==='rotate'){ ang=r.baseAngle + (r._rot=(r._rot||0)+ (v>0.3? 0.06:0)); }
    else if(r.type==='branch'){ ang=r.baseAngle + (v-0.5)*r.d; }
    else if(r.type==='bridge'){ sensor = v>0.5; }        // 押すと橋が開く（すり抜け）
    else if(r.type==='spring'){                          // 押し込んで離すと弾く
      if(r._prevV>0.6 && v<=0.6){ const d=Vector.magnitude(Vector.sub(coin.position,{x:r.baseX,y:r.baseY}));
        if(d<r.w/2+18){ Body.setVelocity(coin,{x:coin.velocity.x,y:-11}); sfx('spring'); } }
    }
    Body.setPosition(b,{x,y}); Body.setAngle(b,ang);
    b.isSensor=sensor; b.render&&(b.render.visible=!sensor);
    r._curSensor=sensor; r._prevV=v;
  }
}

/* ===================== ゲーム進行 ===================== */
function startGame(){
  buildWorld(); state='play'; tLeft=COURSE.timeLimit; score=0; lampT=0;
  startTime=performance.now(); overlay.classList.add('hidden'); sfx('coin');
}
function fail(msg){
  if(state!=='play')return; state='fail'; sfx('fail'); lampT=0;
  showOverlay('ざんねん', msg||'10円玉が落ちてしまった…', 'もう一度');
}
function clearGame(){
  if(state!=='play')return; state='clear';
  const t=(performance.now()-startTime)/1000;
  score=Math.max(0,Math.round(tLeft*80))+500;
  sfx('bell'); lampT=1;
  showOverlay('クリア！ 🔔','タイム '+t.toFixed(1)+'秒／スコア '+score,'もう一度');
}
let lastTs=0;
function tick(ts){
  const dt=Math.min(50, ts-lastTs||16); lastTs=ts;
  if(state==='play'){
    // time
    tLeft-=dt/1000; if(tLeft<=0){tLeft=0; fail('制限時間オーバー'); }
    updateLevers(); applyRails();
    // physics substeps (CCD対策)
    const SUB=3; for(let i=0;i<SUB;i++) Engine.update(engine,(1000/60)/SUB);
    // fail / clear checks
    const c=coin.position, sp=Vector.magnitude(coin.velocity);
    if(c.y>lastY-0.4) { if(sp<0.5) idleT+=dt; else idleT=0; } else idleT=0;
    lastY=Math.max(lastY,c.y);
    if(idleT>9000) fail('10円玉が止まってしまった');
    for(const h of holes){ if(Math.hypot(c.x-h.x,c.y-h.y)<h.r-2){ fail('穴に落ちた'); break; } }
    if(c.x<-24||c.x>WORLD_W+24) fail('盤面の外へ出た');
    if(c.y>WORLD_H+24) fail('回収口へ落ちた');
    if(c.x>goal.x && c.x<goal.x+goal.w && c.y>goal.y && c.y<goal.y+goal.h) clearGame();
    score=Math.max(score,Math.round((coin.position.y/WORLD_H)*400));
  }
  if(lampT>0) lampT=(state==='clear')?lampT+dt/1000:0;
  draw();
  document.getElementById('timeL').textContent='TIME '+Math.ceil(tLeft);
  document.getElementById('scoreL').textContent='SCORE '+score;
  requestAnimationFrame(tick);
}

/* ===================== 描画 ===================== */
function draw(){
  ctx.clearRect(0,0,WORLD_W,WORLD_H);
  drawBackground(COURSE.background);
  // holes
  for(const h of holes){
    const g=ctx.createRadialGradient(h.x,h.y-4,2,h.x,h.y,h.r);
    g.addColorStop(0,'#000');g.addColorStop(.7,'#0a0a0a');g.addColorStop(1,'rgba(0,0,0,.1)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.stroke();
  }
  // walls
  for(const b of wallBodies) drawBody(b,'#0e3a5f');
  // goal
  drawGoal();
  // rails
  for(const r of railDefs) drawRail(r);
  // coin
  drawCoin(coin.position.x,coin.position.y,13,coin.angle,coin.velocity.x);
  // levers
  for(const l of levers) drawLever(l);
}
function drawBackground(kind){
  if(kind==='space'){
    ctx.fillStyle='#05061a';ctx.fillRect(0,0,WORLD_W,WORLD_H);
    ctx.fillStyle='#fff';for(let i=0;i<60;i++){const x=(i*97)%WORLD_W,y=(i*53)%WORLD_H;ctx.globalAlpha=.3+((i*7)%10)/14;ctx.fillRect(x,y,2,2);}ctx.globalAlpha=1;
    return;
  }
  // sky (default, 昭和レトロ)
  const g=ctx.createLinearGradient(0,0,0,WORLD_H);
  g.addColorStop(0,'#8fd0ff');g.addColorStop(.5,'#bfe6ff');g.addColorStop(1,'#eaf7ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,WORLD_W,WORLD_H);
  ctx.fillStyle='rgba(255,255,255,.85)';
  const clouds=[[70,90,26],[330,150,30],[200,300,24],[100,470,28],[360,540,26],[240,640,30]];
  for(const[cx,cy,r]of clouds){ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.arc(cx+r*0.8,cy+4,r*0.7,0,7);ctx.arc(cx-r*0.8,cy+4,r*0.7,0,7);ctx.fill();}
  // Mt Fuji
  ctx.fillStyle='#8aa6c8';ctx.beginPath();ctx.moveTo(300,250);ctx.lineTo(360,150);ctx.lineTo(420,250);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(342,176);ctx.lineTo(360,150);ctx.lineTo(378,176);ctx.quadraticCurveTo(360,186,342,176);ctx.fill();
}
function drawRail(r){
  const b=railBodies[r.id], v=r._curSensor;
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  const w=r.w,h=r.h;
  if(r.type==='bridge'&&v){ // 開いた橋（点線）
    ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.setLineDash([8,8]);
    ctx.beginPath();ctx.moveTo(-w/2,0);ctx.lineTo(w/2,0);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();return;
  }
  // 白い可動レール（金属光沢）
  roundRectC(-w/2,-h/2,w,h,h/2);
  const g=ctx.createLinearGradient(0,-h/2,0,h/2);
  g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#e6eef5');g.addColorStop(1,'#b9c7d4');
  ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#5b7fa0';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(-w/2+3,-h/2+2,w-6,2);
  // 端キャップ
  ctx.fillStyle='#3f7bd1';ctx.beginPath();ctx.arc(-w/2,0,h/2-1,0,7);ctx.fill();ctx.beginPath();ctx.arc(w/2,0,h/2-1,0,7);ctx.fill();
  ctx.restore();
}
function drawBody(b,col){
  ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
  const v=b.vertices;ctx.beginPath();
  ctx.moveTo(v[0].x-b.position.x,v[0].y-b.position.y);
  for(let i=1;i<v.length;i++)ctx.lineTo(v[i].x-b.position.x,v[i].y-b.position.y);
  ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore();
}
function drawGoal(){
  const gx=goal.x,gy=goal.y,gw=goal.w,gh=goal.h;
  ctx.fillStyle=(state==='clear'&&Math.floor(lampT*6)%2)?'#ffef7a':'#1e7d3a';
  roundRectC(gx,gy,gw,gh,10);ctx.fill();
  ctx.strokeStyle='#0c4a1e';ctx.lineWidth=3;roundRectC(gx,gy,gw,gh,10);ctx.stroke();
  // lamps
  for(let i=0;i<5;i++){const lx=gx+12+i*(gw-24)/4;
    ctx.fillStyle=(state==='clear'&&Math.floor(lampT*8+i)%2)?'#fff29a':'#0c4a1e';
    ctx.beginPath();ctx.arc(lx,gy-8,4,0,7);ctx.fill();}
  ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('ゴール',gx+gw/2,gy+gh/2);ctx.textBaseline='alphabetic';
}
function drawCoin(x,y,r,ang,vx){
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;
  // 表裏フリップ演出：横速度で回転位相を進める
  flipPhase+=Math.abs(vx)*0.028;
  const sx=Math.max(0.5,Math.abs(Math.cos(flipPhase)));
  ctx.scale(sx,1);
  const g=ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.2,0,0,r);
  g.addColorStop(0,'#ffe9a0');g.addColorStop(.6,'#d9a92a');g.addColorStop(1,'#a97b12');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();ctx.shadowColor='transparent';
  ctx.strokeStyle='#8a6410';ctx.lineWidth=r*0.13;ctx.beginPath();ctx.arc(0,0,r*0.82,0,7);ctx.stroke();
  ctx.save();ctx.rotate(ang);
  ctx.strokeStyle='rgba(122,86,14,.45)';ctx.lineWidth=r*0.09;
  for(let a=0;a<3;a++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a*2.1)*r*0.62,Math.sin(a*2.1)*r*0.62);ctx.stroke();}
  ctx.restore();
  ctx.fillStyle='#7a560e';ctx.font='bold '+Math.round(r*(Math.cos(flipPhase)>=0?0.85:0.85))+'px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(Math.cos(flipPhase)>=0?'10':'円',0,r*0.06);
  ctx.restore();ctx.textBaseline='alphabetic';
}
function drawLever(l){
  const active=l.value>0.02;
  const topY=l.cy-l.len, ky=l.cy-l.value*l.len;
  // base plate
  ctx.fillStyle='#20364a';roundRectC(l.cx-14,l.cy-2,28,16,4);ctx.fill();
  // slot track
  ctx.strokeStyle='#0a1c2c';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(l.cx,l.cy);ctx.lineTo(l.cx,topY);ctx.stroke();
  ctx.strokeStyle='#3b5b78';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(l.cx,l.cy);ctx.lineTo(l.cx,topY);ctx.stroke();
  // stick
  ctx.strokeStyle='#c7d3dd';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(l.cx,l.cy+6);ctx.lineTo(l.cx,ky);ctx.stroke();
  // knob
  const g=ctx.createRadialGradient(l.cx-4,ky-4,2,l.cx,ky,13);
  g.addColorStop(0,active?'#ff9a9a':'#ff7a7a');g.addColorStop(1,active?'#c0392b':'#8f2c22');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(l.cx,ky,12,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(l.id,l.cx,ky);ctx.textBaseline='alphabetic';
}
function roundRectC(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ===================== サウンド ===================== */
let AC=null;
function beep(f,d,t,g){ if(!soundOn)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),ga=AC.createGain();o.type=t||'square';o.frequency.value=f;
  o.connect(ga);ga.connect(AC.destination);const n=AC.currentTime;
  ga.gain.setValueAtTime(0,n);ga.gain.linearRampToValueAtTime(g||0.14,n+0.01);
  ga.gain.exponentialRampToValueAtTime(0.0001,n+(d||0.12));o.start(n);o.stop(n+(d||0.12)+0.02);}catch(e){} }
function sfx(kind){
  if(kind==='coin'){beep(1046,0.08,'square',0.16);setTimeout(()=>beep(1568,0.12,'square',0.16),80);}
  else if(kind==='spring'){beep(660,0.09,'triangle',0.16);}
  else if(kind==='fail'){beep(200,0.25,'sawtooth',0.18);setTimeout(()=>beep(130,0.35,'sawtooth',0.16),140);}
  else if(kind==='bell'){[880,1108,1318,1760,1318,1760].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'sine',0.2),i*130));}
}
document.getElementById('sound').addEventListener('click',()=>{
  soundOn=!soundOn; document.getElementById('sound').textContent=soundOn?'🔊 音ON':'🔇 音OFF';
});

function showOverlay(title,desc,btn){
  overlay.innerHTML='<h1>'+title+'</h1><p>'+desc+'</p><button class="btn" id="againBtn">'+btn+'</button>';
  overlay.classList.remove('hidden');
  document.getElementById('againBtn').addEventListener('click',startGame);
}
document.getElementById('startBtn').addEventListener('click',startGame);
